  _qaRows = grp.slice().sort((a,b)=>{
    const lc=(a.location||"").localeCompare(b.location||"");
    return lc!==0?lc:new Date(a.expDate||"9999")-new Date(b.expDate||"9999");
  });

  let rows="";
  _qaRows.forEach((item,idx)=>{
    const locLine = multiLoc
      ? `<div style="color:var(--blue);font-weight:600;font-size:11px;text-transform:uppercase;margin-bottom:2px">${esc(item.location)}</div>`
      : "";
    rows+=`<div class="brow">
      <div class="brow-info">
        ${locLine}
        <div class="brow-exp">${item.expDate?`Exp ${item.expDate}`:"No exp date"}</div>
        <div class="brow-sub" id="qa-cur-${idx}">Current: ${item.qty||0}</div>
      </div>
      <div class="qc">
        <button class="qb" onclick="qaStep(${idx},-1)">−</button>
        <input id="qa-val-${idx}" type="number" min="0" step="0.01" value="${item.qty||0}" inputmode="decimal"
          style="width:60px;padding:5px 4px;border:1px solid var(--border2);border-radius:var(--r);font-size:15px;background:var(--bg);color:var(--text);text-align:center"
          oninput="qaInput(${idx},parseFloat(this.value)||0)">
        <button class="qb" onclick="qaStep(${idx},1)">+</button>
      </div>
    </div>`;
  });

  const subtitle = multiLoc
    ? `${[...new Set(grp.map(i=>i.location))].length} locations · ${grp.reduce((s,i)=>s+(i.qty||0),0)} total`
    : esc(rep.location);

  showModal(`<div class="mhandle"></div><h2>± Adjust Quantities</h2>
    <div style="background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:16px">
      <div style="font-weight:700;font-size:15px;margin-bottom:2px">${esc(rep.name)}</div>
      <div style="font-size:13px;color:var(--text2)">${subtitle}</div>
    </div>
    ${rows}
    <div class="macts">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn p" style="flex:1" onclick="doQaSave()">Save Changes</button>
    </div>`);
}

function qaStep(idx, delta){
  if(!_qaRows[idx]) return;
  const inp = document.getElementById("qa-val-"+idx); if(!inp) return;
  const cur = parseFloat(inp.value)||0;
  const nv  = Math.max(0, Math.round((cur+delta)*100)/100);
  inp.value = nv;
  _qaRows[idx]._cur = nv; // store locally only
}

function qaInput(idx, val){
  if(!_qaRows[idx]) return;
  _qaRows[idx]._cur = Math.max(0, isNaN(val)?0:Math.round(val*100)/100);
}

async function doQaSave(){
  // Read final values from DOM, write only changed rows
  const changes = [];
  _qaRows.forEach((item, idx)=>{
    const inp = document.getElementById("qa-val-"+idx);
    const nv  = inp ? Math.max(0, Math.round((parseFloat(inp.value)||0)*100)/100) : (item._cur||item.qty||0);
    if(nv !== (item.qty||0)) changes.push({id:item.id, nv});
  });
  silentClose();
  for(const {id,nv} of changes){
    if(DB[id]){ DB[id].qty = nv; if(nv===0) DB[id].expDate=""; }
    const upd = {qty: nv};
    if(nv===0) upd.expDate = "";
    await update(ref(db,`items/${id}`), upd);
  }
  if(changes.length){
    const itemName = _qaRows[0]?.name||"item";
    const detail = changes.map(({id,nv})=>{
      const orig = _qaRows.find(r=>r.id===id);
      return orig ? `${orig.expDate||"no date"}: ${orig.qty||0}→${nv}` : `→${nv}`;
    }).join(", ");
    await fLog(`Adjusted "${itemName}" — ${detail}`);
  };
  _qaRows = [];
  render();
}

      <button class="btn p" onclick="doMove()">Move Stock</button>
    </div>`);
}

function mvTot(){
  let t=0;
  _mvSnap.forEach((_,idx)=>{
    const v=parseFloat(document.getElementById("mv-"+idx)?.value||"0");
    if(!isNaN(v)&&v>0) t+=v;
  });
  const el=document.getElementById("mv-tot");
  if(el) el.textContent=t>0?`Moving ${t} unit${t!==1?"s":""} total`:"Enter quantities above";
}

async function doMove(){
  const dest=document.getElementById("mv-dest")?.value;
  if(!dest){alert("Please select a destination.");return;}

  // Step 1: Read all values from DOM while modal still exists
  const ops=[];
  let total=0;
  for(let idx=0;idx<_mvSnap.length;idx++){
    const item=_mvSnap[idx];
    const mq=parseFloat(document.getElementById("mv-"+idx)?.value||"0");
    if(isNaN(mq)||mq<=0) continue;
    if(mq>item.qty){
      alert(`Cannot move ${mq} of "${item.name}" (${item.expDate||"no exp"}, ${item.location}) — only ${item.qty||0} available.`);
      return;
    }
    ops.push({item,mq});
    total+=mq;
  }
  if(!total){alert("Enter at least one quantity greater than 0.");return;}

  // Step 2: Silent close before writes
  silentClose();

  // Step 3: Pre-capture destination records to avoid mid-flight read issues
  const destCache={};
  const snap=allItems();
  for(const {item} of ops){
    const ck=item.expDate+"||"+dest;
    if(!(ck in destCache)){
      const ex=snap.find(r=>r.id!==item.id&&r.name.toLowerCase().trim()===item.name.toLowerCase().trim()&&r.location===dest&&(r.expDate||"")===(item.expDate||""));
      destCache[ck]=ex?{id:ex.id,qty:ex.qty||0}:null;
    }
  }

  // Step 4: Write — block onValue re-renders during writes
  modalOpen = true;
  for(const {item,mq} of ops){
    const srcId = item.id;
    const newSrc = Math.max(0, (DB[srcId]?.qty||0) - mq);
    // Always keep record at 0 — never delete. Clear expDate when emptied.
    DB[srcId] = {...(DB[srcId]||{}), qty: newSrc, ...(newSrc===0?{expDate:""}:{})};
    const srcUpdate = {qty: newSrc};
    if(newSrc===0) srcUpdate.expDate = "";
    await update(ref(db,`items/${srcId}`), srcUpdate);

    const ck=item.expDate+"||"+dest;
    if(destCache[ck]){
      const {id,qty}=destCache[ck];
      if(DB[id]) DB[id].qty = qty+mq;
      await fSetQty(id, qty+mq);
      destCache[ck].qty=qty+mq;
    } else {
      // New record at destination — inherit sortOrder from siblings
      const nameLower = item.name.toLowerCase().trim();
      const sibling   = allItems().find(i=>i.name.toLowerCase().trim()===nameLower);
      const sortOrder = sibling ? (sibling.sortOrder??9999) : 9999;
      await set(push(ref(db,"items")), {...clean({
        name:item.name, sku:item.sku||"", category:item.category||CATS[0],
        location:dest, qty:mq, locThresh:item.locThresh||DEF_LOW,
        grpThresh:item.grpThresh||DEF_LOW, expDate:item.expDate||"", notes:item.notes||"",
        price:item.price||0, priceType:item.priceType||"unit"
      }), sortOrder});
    }
  }
  modalOpen = false;
  const fromLocs=[...new Set(_mvSnap.map(i=>i.location))].join(", ");
  await fLog(`Moved ${total} of "${_mvSnap[0].name}" from ${fromLocs} → ${dest}`);
  render();
}

let _scanStream   = null;
let _scanInterval = null;
let _zxing        = null;

async function startCamera(){
  const startBtn = document.getElementById("sc-start");
  const view     = document.getElementById("sc-view");
  const video    = document.getElementById("sc-video");
  const res      = document.getElementById("sc-res");

  if(res){ res.textContent="Starting camera…"; res.className="scan-res"; }

  try{
    if(!_zxing){
      const mod = await import("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.4/esm/index.min.js");
      _zxing = new mod.BrowserMultiFormatReader();
    }

    const devices = await _zxing.listVideoInputDevices();
    const rear = devices.find(d=>d.label.toLowerCase().includes("back")||d.label.toLowerCase().includes("rear")||d.label.toLowerCase().includes("environment"));
    const deviceId = rear?.deviceId || devices[devices.length-1]?.deviceId || undefined;

    if(startBtn) startBtn.style.display="none";
    if(view)     view.style.display="block";
    if(res){ res.textContent="Point at a barcode…"; res.className="scan-res"; }

    _zxing.decodeFromVideoDevice(deviceId, video, (result, err)=>{
      if(result && !_scanPaused){
        doScan(result.getText());
      }
    });

  }catch(err){
    if(res){
      res.textContent = err.name==="NotAllowedError"
        ? "Camera permission denied. Allow camera access and try again."
        : `Could not start camera: ${err.message||err.name}. Use manual SKU entry.`;
      res.className="scan-res no";
    }
    console.error("Camera error:", err);
  }
}

function stopCamera(){
  if(_zxing){ try{ _zxing.reset(); }catch(e){} _zxing=null; }
  if(_scanInterval){ clearInterval(_scanInterval); _scanInterval=null; }
  if(_scanStream){ _scanStream.getTracks().forEach(t=>t.stop()); _scanStream=null; }
}


let _scanPaused = false; // pause scanning while selection modal is open

async function doScan(sku){
  if(!sku || _scanPaused) return;
  _scanPaused = true; // prevent duplicate scans while processing

  const matches = allItems().filter(i=>i.sku&&i.sku.toLowerCase()===sku.toLowerCase());
  const el = document.getElementById("sc-res");

  if(!matches.length){
    if(el){ el.textContent=`No item with SKU "${sku}". Add the SKU to an item first.`; el.className="scan-res no"; }
    setTimeout(()=>{
      const e=document.getElementById("sc-res");
      if(e){ e.textContent="Point at a barcode…"; e.className="scan-res"; }
      _scanPaused=false;
    }, 3000);
    return;
  }

  // Flash recognition on scan result area
  if(el){ el.textContent=`Found: ${matches[0].name} — selecting…`; el.className="scan-res ok"; }

  // Step 1: group by location
  const locMap={};
  matches.forEach(i=>{ (locMap[i.location]=locMap[i.location]||[]).push(i); });
  const locs=Object.keys(locMap);

  let chosenLoc, chosenId, chosenQty=1;

  // If only one location, skip location step
  if(locs.length===1){
    chosenLoc=locs[0];
  } else {
    chosenLoc = await pickScanOption(
      `📍 ${matches[0].name}`,
      "Which location are you adding to?",
      locs.map(l=>({ label:`${l}`, sub:`${locMap[l].reduce((s,i)=>s+(i.qty||0),0)} in stock` }))
    );
    if(!chosenLoc){ _scanPaused=false; return; } // cancelled
  }

  const locItems = locMap[chosenLoc];

  // Step 2: pick expiration batch (if multiple)
  if(locItems.length===1){
    chosenId = locItems[0].id;
  } else {
    const sorted = locItems.slice().sort((a,b)=>new Date(a.expDate||"9999")-new Date(b.expDate||"9999"));
    const batches = sorted.map(i=>({
      label: i.expDate||"No expiration date",
      sub:   `${i.qty||0} units`,
      id:    i.id
    }));
    batches.push({ label:"+ Add as new expiration date", sub:"", id:"__new__" });

    const picked = await pickScanOption(
      `📦 ${matches[0].name} — ${chosenLoc}`,
      "Which batch are you adding to?",
      batches
    );
    if(!picked){ _scanPaused=false; return; }
    if(picked==="+ Add as new expiration date"){
      // Open add item modal pre-filled
      stopCamera();
      closeModal();
      openAdd();
      _scanPaused=false;
      return;
    }
    const pickedItem = sorted.find(i=>i.expDate===picked||(picked==="No expiration date"&&!i.expDate));
    if(!pickedItem){ _scanPaused=false; return; }
    chosenId = pickedItem.id;
  }

  // Step 3: qty
  chosenQty = await pickScanQty(matches[0].name, chosenLoc);
  if(!chosenQty){ _scanPaused=false; return; }

  // Apply
  const item = DB[chosenId]; if(!item){ _scanPaused=false; return; }
  const newQty = (item.qty||0) + chosenQty;
  DB[chosenId].qty = newQty;
  await update(ref(db,`items/${chosenId}`),{qty:newQty});
  await fLog(`Scanned "${item.name}" +${chosenQty} → ${item.location} (${item.expDate||"no date"}) now ${newQty}`);

  // Show result back in scan modal
  if(el){ el.textContent=`✓ Added ${chosenQty}× ${item.name} · ${chosenLoc}${item.expDate?" · "+item.expDate:""} · now ${newQty}`; el.className="scan-res ok"; }
  render();
  setTimeout(()=>{
    const e=document.getElementById("sc-res");
    if(e){ e.textContent="Point at next barcode…"; e.className="scan-res"; }
    _scanPaused=false;
  }, 2500);
}

function snackItems(){
  return Object.entries(SDB)
    .filter(([,v])=>v&&v.name&&String(v.name).trim()&&v.location)
    .map(([id,v])=>({...v, id, qty:Number(v.qty)||0, locThresh:Number(v.locThresh)||DEF_LOW}));
}

function snackFiltered(){
  let arr=snackItems();
  const loc = SLOCS[Math.max(0, SUI.tab-1)];
  arr = arr.filter(i=>i.location===loc);
  if(SUI.fCat!=="all") arr=arr.filter(i=>i.category===SUI.fCat);
  if(SUI.search){ const q=SUI.search.toLowerCase(); arr=arr.filter(i=>i.name.toLowerCase().includes(q)||(i.notes||"").toLowerCase().includes(q)); }
  return arr.sort((a,b)=>a.name.localeCompare(b.name));
}

function snackStatus(i){
  if(!(i.qty||0)) return "out";
  if(i.expDate && i.expDate < new Date().toISOString().slice(0,10)) return "exp";
  return "ok";
}

function renderSnacks(app){
  const arr=snackFiltered(), all=snackItems();
  // Default to first location if none selected
  if(SUI.tab===0) SUI.tab=1;

  const scope=SUI.tab>0?all.filter(i=>i.location===SLOCS[SUI.tab-1]):all;
  const uniq=[...new Set(scope.map(i=>i.name.toLowerCase().trim()))].length;
  const low=scope.filter(i=>snackStatus(i)==="low").length;
  const out=scope.filter(i=>snackStatus(i)==="out").length;

  const tabsH=`<div class="tabs-wrap"><div class="tabs">
    ${SLOCS.map((l,i)=>`<button class="tab ${SUI.tab===i+1?"on":""}" onclick="SUI.tab=${i+1};render()">${esc(l)}</button>`).join("")}

    <div class="sc"><div class="sc-lbl">Items</div><div class="sc-val">${uniq}</div></div>

  </div>`;

  // Group by category (in SCATS order), then alphabetically within each category

      sorted.forEach(g=>{

        const sid=encIds(g.map(i=>i.id));
        const single=g.length===1;

        // Build expiration display using all batches
        const expHtmlS = (()=>{

          const noDate=g.filter(i=>!i.expDate);

function renderSnackExp(app){
  const arr=snackItems(), now=new Date();
  const withD=arr.filter(i=>i.expDate), noD=arr.filter(i=>!i.expDate);
  const bkts={};
  withD.forEach(i=>{ const d=new Date(i.expDate),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; (bkts[k]=bkts[k]||[]).push(i); });
  const keys=Object.keys(bkts).sort();
  function sUrgency(k){ const[y,m]=k.split("-"),me=new Date(+y,+m,0); if(me<now)return"past"; const ms=new Date(+y,+m-1,1); if(ms.getFullYear()===now.getFullYear()&&ms.getMonth()===now.getMonth())return"cur"; const nxt=new Date(now.getFullYear(),now.getMonth()+1,1); if(ms>=nxt&&ms<new Date(now.getFullYear(),now.getMonth()+2,1))return"next"; return"future"; }
  const US={past:{b:"var(--red)",h:"var(--red)",bg:"var(--red-bg)",ic:"🚫"},cur:{b:"var(--yellow)",h:"var(--yellow)",bg:"var(--yellow-bg)",ic:"⚠️"},next:{b:"var(--yellow)",h:"var(--yellow)",bg:"var(--yellow-bg)",ic:"⏳"},future:{b:"var(--border)",h:"var(--text2)",bg:"var(--bg2)",ic:"🗓️"}};
  function sMlabel(k){ const[y,m]=k.split("-"); return new Date(+y,+m-1,1).toLocaleString("default",{month:"long",year:"numeric"}); }
  const expC=withD.filter(i=>new Date(i.expDate)<now).length;
  const n30=withD.filter(i=>{ const d=days(i.expDate); return d!==null&&d>=0&&d<=30; }).length;
  function sIrow(i){
    const d=days(i.expDate);
    const urgClr=d===null?"var(--text3)":d<=0?"var(--red)":d<=30?"var(--yellow)":"var(--text2)";
    const urgLbl=d===null?"":d<=0?" · EXPIRED":` · ${d}d left`;
    return `<div class="arow">
      <div class="arow-info"><div class="arow-name">${esc(i.name)}</div><div class="arow-sub">${esc(i.location)} · ${esc(i.category||"—")}</div></div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:13px;font-weight:700;color:${urgClr}">${i.expDate||"—"}${urgLbl}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">Qty: ${i.qty}</div>
      </div></div>`;
  }
  let h=`<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
    <div class="sc"><div class="sc-lbl">With Date</div><div class="sc-val">${withD.length}</div></div>
    <div class="sc"><div class="sc-lbl">Expired</div><div class="sc-val ${expC>0?"r":""}">${expC}</div></div>
    <div class="sc"><div class="sc-lbl">Next 30 Days</div><div class="sc-val ${n30>0?"y":""}">${n30}</div></div>
  </div>`;
  if(!keys.length&&!noD.length){ h+=`<div class="card"><div class="empty"><div class="empty-icon">🗓️</div>No expiration dates set yet.</div></div>`; app.innerHTML=h; return; }
  keys.forEach(k=>{ const u=sUrgency(k),s=US[u],its=bkts[k].slice().sort((a,b)=>new Date(a.expDate)-new Date(b.expDate)); h+=`<div class="card ecal" style="border-left-color:${s.b}"><div class="sec-hdr" style="color:${s.h};background:${s.bg};display:flex;justify-content:space-between;align-items:center"><span>${s.ic} ${sMlabel(k)}</span><span style="font-size:12px;opacity:.8">${its.length} item${its.length!==1?"s":""}</span></div>${its.map(sIrow).join("")}</div>`; });
  if(noD.length){ h+=`<div class="card" style="opacity:.75"><div class="sec-hdr" style="color:var(--text3);display:flex;justify-content:space-between"><span>📦 No Expiration Date</span><span style="font-size:12px">${noD.length} item${noD.length!==1?"s":""}</span></div>${noD.sort((a,b)=>a.name.localeCompare(b.name)).map(sIrow).join("")}</div>`; }
  app.innerHTML=h;
}

function getFacility(location){
  if(HUBS.includes(location)) return location;
  const t = TRUCKS.find(t=>t.name===location);
  return t ? t.hub : (HUBS[0]||"Hub");
}

function isoWeek(ts){
  const d=new Date(ts); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+4-(d.getDay()||7));
  const yr=d.getFullYear();
  const wk=Math.ceil((((d-new Date(yr,0,1))/86400000)+1)/7);
  return `${yr}-W${String(wk).padStart(2,"0")}`;
}

function weekLabel(isoW){
  const[yr,wStr]=isoW.split("-W"); const wn=parseInt(wStr);
  const jan4=new Date(+yr,0,4);
  const mon=new Date(jan4.getTime()+(wn-1)*7*86400000-(jan4.getDay()||7-1)*86400000);
  const sun=new Date(mon.getTime()+6*86400000);
  const fmt=d=>d.toLocaleDateString("default",{month:"short",day:"numeric"});
  return `${fmt(mon)} – ${fmt(sun)}`;
}

function openDist(ii){
  const id=(window._ids||[])[ii]; if(!id) return;
  const item=DB[id]; if(!item) return;

  // Find all batches for this item at this location
  const batches = allItems().filter(i=>i.name===item.name && i.location===item.location)

  window._distId = batches[0]?.id || id;
  window._distType = "used";

  const batchSelect = batches.length > 1
    ? `<div class="fg"><label>Expiration Batch *</label>
        <select id="dist-batch" onchange="window._distId=this.value" style="font-size:15px;padding:12px 14px">
          ${batches.map(b=>`<option value="${b.id}">${b.expDate||"No date"} · ${b.qty||0} in stock</option>`).join("")}
        </select>
       </div>`
    : `<div style="font-size:13px;color:var(--text2);margin-bottom:12px">
        In stock: <strong>${item.qty||0}</strong>
       </div>`;

  showModal(`<div class="mhandle"></div><h2>📉 Log Distribution</h2>
    <div style="background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:14px">
      <div style="font-weight:700;font-size:15px;margin-bottom:2px">${esc(item.name)}</div>
      <div style="font-size:13px;color:var(--text2)">${esc(item.location)}</div>
    </div>
    ${batchSelect}
    <div class="fg"><label>Quantity being removed *</label>
      <input id="dist-qty" type="number" min="0.01" step="0.01" value="1" inputmode="decimal">
    </div>
    <div class="fg"><label>Reason *</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
        <button id="dist-btn-used" onclick="distSelect('used')" style="
          display:flex;align-items:center;gap:12px;padding:14px;
          border-radius:var(--r);border:2px solid var(--scarlet);
          background:var(--scarlet);color:#fff;cursor:pointer;text-align:left;width:100%">
          <span style="font-size:20px">✅</span>
          <div>
            <div style="font-weight:700;font-size:14px">Put out / Distributed</div>
            <div style="font-size:12px;opacity:.85">Weight room, locker room, fueling station, etc.</div>
          </div>
        </button>
      </div>

      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn p" onclick="doDist()">Log & Deduct</button>

}

function distSelect(type){
  window._distType = type;
  const usedBtn  = document.getElementById("dist-btn-used");
  const wasteBtn = document.getElementById("dist-btn-waste");
  if(usedBtn){
    usedBtn.style.background  = type==="used"?"var(--scarlet)":"var(--bg)";
    usedBtn.style.color       = type==="used"?"#fff":"var(--text)";
    usedBtn.style.borderColor = type==="used"?"var(--scarlet)":"var(--border2)";
  }
  if(wasteBtn){
    wasteBtn.style.background  = type==="waste"?"var(--red)":"var(--bg)";
    wasteBtn.style.color       = type==="waste"?"#fff":"var(--text)";
    wasteBtn.style.borderColor = type==="waste"?"var(--red)":"var(--border2)";
  }
}

async function doDist(){
  const id=window._distId; if(!id) return;
  const item=DB[id]; if(!item) return;
  const qty=Math.max(0.01,parseFloat(document.getElementById("dist-qty")?.value)||1);
  const type=window._distType||"used";
  if(qty>(item.qty||0)){ alert(`Only ${item.qty||0} in stock — can't remove ${qty}.`); return; }
  const newQty=(item.qty||0)-qty;
  const who=localStorage.getItem("inv_display_name")||(currentUser?.displayName||currentUser?.email||"Unknown");
  const now=Date.now();
  const week=isoWeek(now);
  const fac=getFacility(item.location);
  const price=item.price||0;
  const priceType=item.priceType||"unit";
  const value=price*qty;
  silentClose();
  DB[id].qty=newQty;
  await update(ref(db,`items/${id}`),{qty:newQty});
  await set(push(ref(db,"usage")),{
    name:item.name, qty, type, facility:fac, location:item.location,
    week, ts:now, who, date:new Date(now).toLocaleDateString(),
    price, priceType, value
  });
  await fLog(`${type==="used"?"Distributed":"Wasted"} ${qty} of "${item.name}" from ${item.location} → ${newQty} remaining${value>0?" · "+fmtPrice(value)+" value":""}`);
  render();
}

let _trkRange="4w";
let _trkShow="used";
let _trkMonth=null;

function setTrkRange(v){ _trkRange=v; render(); }
function setTrkShow(v){  _trkShow=v;  render(); }
function setTrkMonth(v){ _trkMonth=v; render(); }

async function deleteUsage(idsEncoded, name){
  const ids = JSON.parse(decodeURIComponent(idsEncoded));
  if(!ids.length) return;
  if(!confirm(`Delete all usage entries for "${name}"?\n\nThis removes all logged data for this item. This cannot be undone.`)) return;
  for(const id of ids){
    await remove(ref(db,`usage/${id}`));
    delete USAGE[id];
  }
  render();
}

function renderTracker(app){
  const allEntries = Object.entries(USAGE); // [id, entry]
  const now = Date.now();
  const thisWeek = isoWeek(now);

  function prevWeek(isoW, n){
    const[yr,wStr]=isoW.split("-W"); let wn=parseInt(wStr)-n;
    let y=+yr;
    while(wn<1){ wn+=52; y--; }
    return `${y}-W${String(wn).padStart(2,"0")}`;
  }
  const last4Weeks = [thisWeek, prevWeek(thisWeek,1), prevWeek(thisWeek,2), prevWeek(thisWeek,3)];

  // Show filter (Distributed / Wasted / Both)
  const showBtn=(v,lbl)=>`<button onclick="setTrkShow('${v}')" style="padding:6px 14px;border-radius:var(--r);border:1px solid ${_trkShow===v?"var(--scarlet)":"var(--border2)"};background:${_trkShow===v?"var(--scarlet)":"var(--bg)"};color:${_trkShow===v?"#fff":"var(--text2)"};font-size:12px;font-weight:600;cursor:pointer">${lbl}</button>`;

  let h=`<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:13px;color:var(--text2)">Showing <strong>This Week</strong> usage and <strong>4-Week Average</strong>.</div>
  </div>`;

  h += truckOrdersPanel();
  const pendMap = pendingByFac();

  // Filter entries by show type
  const filtered = allEntries.filter(([,e])=>_trkShow==="both"||e.type===_trkShow);
  const names = [...new Set(filtered.map(([,e])=>e.name))].sort();
  Object.values(pendMap).forEach(fm=>Object.values(fm).forEach(p=>{ if(!names.includes(p.name)) names.push(p.name); }));
  names.sort();

  if(!names.length){
    h+=`<div class="card"><div class="empty"><div class="empty-icon">📊</div>No data yet.<br><div style="font-size:13px;margin-top:8px;color:var(--text3)">Use the 📉 button on inventory items to log distributions.</div></div></div>`;
    app.innerHTML=h; return;
  }

  // Build wasted value section (only when showing waste or both)
  const wasteEntries = allEntries.filter(([,e])=>e.type==="waste");
  const thisWkWaste  = wasteEntries.filter(([,e])=>(e.week||isoWeek(e.ts))===thisWeek);

  if((_trkShow==="waste"||_trkShow==="both") && wasteEntries.length){
    // Calculate value lost by looking up current price from DB
    function wasteValue(entries){
      return entries.reduce(([,e],acc)=>{
        const item = Object.values(DB).find(i=>i.name===e.name);
        if(!item||!item.price) return acc;
        return acc + (item.price * (e.qty||0));
      }, 0);
    }
    // Simpler approach — iterate
    let totalWasteValue = 0, thisWkWasteValue = 0;
    const wasteByFac = {};
    wasteEntries.forEach(([,e])=>{
      const item = Object.values(DB).find(i=>i.name===e.name);
      if(!item||!item.price) return;
      const val = item.price * (e.qty||0);
      const fac = e.facility||getFacility(e.location||"");
      totalWasteValue += val;
      wasteByFac[fac] = wasteByFac[fac]||{total:0,thisWk:0};
      wasteByFac[fac].total += val;
      const isThisWk = (e.week||isoWeek(e.ts))===thisWeek;
      if(isThisWk){ thisWkWasteValue+=val; wasteByFac[fac].thisWk+=val; }
    });

    if(totalWasteValue>0){
      let wasteRows="";
      scopedHubs().forEach(fac=>{
        const fw=wasteByFac[fac]||{total:0,thisWk:0};
        if(!fw.total) return;
        wasteRows+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)">
          <div style="font-weight:600;font-size:13px">🏭 ${fac}</div>
          <div style="text-align:right">
            <div style="font-weight:700;font-size:14px;color:var(--red)">${fmtPrice(fw.total)} total lost</div>
            ${fw.thisWk>0?`<div style="font-size:12px;color:var(--text3)">This week: ${fmtPrice(fw.thisWk)}</div>`:""}
          </div>
        </div>`;
      });
      h+=`<div class="card" style="margin-bottom:16px;border:1px solid var(--red)">
        <div style="padding:12px 16px;background:var(--red-bg);border-bottom:2px solid var(--red);display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:800;font-size:13px;color:var(--red);text-transform:uppercase;letter-spacing:.5px">💸 Total Value Wasted</div>
          <div style="font-weight:800;font-size:16px;color:var(--red)">${fmtPrice(totalWasteValue)}</div>
        </div>
        ${wasteRows}
      </div>`;
    }
  }
  const data={};
  filtered.forEach(([id,e])=>{
    if(!data[e.name]) data[e.name]={};
    const fac=e.facility||getFacility(e.location||"");
    if(!data[e.name][fac]) data[e.name][fac]={};
    const wk=e.week||isoWeek(e.ts);
    if(!data[e.name][fac][wk]) data[e.name][fac][wk]={qty:0,ids:[]};
    data[e.name][fac][wk].qty+=e.qty;
    data[e.name][fac][wk].ids.push(id);
  });
  Object.entries(pendMap).forEach(([fac,fm])=>Object.values(fm).forEach(p=>{
    if(!data[p.name]) data[p.name]={};
    if(!data[p.name][fac]) data[p.name][fac]={};
  }));

  scopedHubs().forEach(fac=>{
    const facNames=names.filter(n=>data[n]?.[fac]);
    if(!facNames.length) return;

    let thead=`<tr style="border-bottom:2px solid var(--border)">
      <th style="min-width:140px;padding:10px 14px;text-align:left;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">Item</th>
      <th style="text-align:right;min-width:90px;padding:10px 14px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">This Week</th>
      <th style="text-align:right;min-width:80px;padding:10px 14px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">1-Wk Avg</th>
      <th style="text-align:right;min-width:80px;padding:10px 14px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">4-Wk Avg</th>
      <th style="text-align:right;min-width:90px;padding:10px 14px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">Value</th>
      <th style="text-align:right;min-width:90px;padding:10px 14px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">Pending</th>
      <th style="width:40px"></th>
    </tr>`;

    let tbody="";
    facNames.forEach(name=>{
      const fd=data[name][fac]||{};
      const thisWkQty=(fd[thisWeek]?.qty)||0;
      const allVals=last4Weeks.map(w=>fd[w]?.qty||0);
      const oneWkVals=[prevWeek(thisWeek,1)].map(w=>fd[w]?.qty||0);
      const oneWkNz=oneWkVals.filter(v=>v>0);
      const oneWkAvg=oneWkNz.length?(oneWkNz.reduce((s,v)=>s+v,0)/oneWkNz.length).toFixed(1):null;
      const nonzero=allVals.filter(v=>v>0);
      const avg=nonzero.length?(nonzero.reduce((s,v)=>s+v,0)/nonzero.length).toFixed(1):null;
      const allIds=Object.values(fd).flatMap(w=>w.ids||[]);
      const idsEncoded=encodeURIComponent(JSON.stringify(allIds));
      const priceForName = (Object.values(DB).find(i=>i.name===name)?.price)||0;
      const thisWkValue   = thisWkQty*priceForName;
      tbody+=`<tr style="border-bottom:1px solid var(--border)">
        <td style="font-weight:600;font-size:13px;padding:10px 14px">${esc(name)}</td>
        <td style="text-align:right;font-weight:700;padding:10px 14px;color:${thisWkQty>0?"var(--scarlet)":"var(--text)"}">${thisWkQty||"—"}</td>
        <td style="text-align:right;color:var(--text2);padding:10px 14px">${oneWkAvg||"—"}</td>
        <td style="text-align:right;color:var(--text2);padding:10px 14px">${avg||"—"}</td>
        <td style="text-align:right;color:var(--text2);padding:10px 14px">${thisWkValue>0?fmtPrice(thisWkValue):"—"}</td>
        <td style="text-align:right;color:var(--yellow);font-weight:700;padding:10px 14px">${pendMap[fac]?.[name.toLowerCase().trim()]?.qty||"—"}</td>
        <td style="text-align:center;padding:6px"><button class="ab" title="Delete" onclick="deleteUsage('${idsEncoded}','${esc(name)}')">🗑️</button></td>
      </tr>`;
    });

    // Total row + wasted value if showing waste
    const thisWkTotal=facNames.reduce((s,n)=>(s+(data[n][fac]?.[thisWeek]?.qty||0)),0);
    const oneWkTotalAvg=facNames.reduce((s,n)=>{
      const v=data[n][fac]?.[prevWeek(thisWeek,1)]?.qty||0;
      return s+v;
    },0);
    const avgTotal=facNames.reduce((s,n)=>{
      const vals=last4Weeks.map(w=>data[n][fac]?.[w]?.qty||0);
      const nz=vals.filter(v=>v>0);
      return s+(nz.length?nz.reduce((a,v)=>a+v,0)/nz.length:0);
    },0);

    // Wasted value for this week
    const wasteValue = (_trkShow==="waste"||_trkShow==="both")
      ? filtered.filter(([,e])=>e.type==="waste"&&(e.facility||getFacility(e.location||""))===fac&&(e.week||isoWeek(e.ts))===thisWeek)
          .reduce((s,[,e])=>s+(e.value||0),0)
      : 0;

    const totalValueThisWk = facNames.reduce((s,n)=>{
      const p=(Object.values(DB).find(i=>i.name===n)?.price)||0;
      return s+((data[n][fac]?.[thisWeek]?.qty||0)*p);
    },0);
    tbody+=`<tr style="border-top:2px solid var(--border);background:var(--bg2)">
      <td style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text3);padding:10px 14px">Total</td>
      <td style="text-align:right;font-weight:700;color:var(--scarlet);padding:10px 14px">${thisWkTotal||"—"}</td>
      <td style="text-align:right;font-weight:700;color:var(--text2);padding:10px 14px">${oneWkTotalAvg||"—"}</td>
      <td style="text-align:right;font-weight:700;color:var(--text2);padding:10px 14px">${avgTotal>0?avgTotal.toFixed(1):"—"}</td>
      <td style="text-align:right;font-weight:700;color:var(--text2);padding:10px 14px">${totalValueThisWk>0?fmtPrice(totalValueThisWk):"—"}</td>
      <td></td><td></td>
    </tr>`;
    if(wasteValue>0){
      tbody+=`<tr style="background:var(--red-bg)">
        <td colspan="6" style="padding:8px 14px;font-size:12px;color:var(--red);font-weight:700">
          💸 Value wasted this week: ${fmtPrice(wasteValue)}
        </td>
      </tr>`;
    }

      const icon="🏭";
      h+=`<div class="card" style="margin-bottom:16px">
        <div style="padding:12px 16px;background:var(--black);color:#fff;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--scarlet)">${icon} ${fac}</div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="width:100%;border-collapse:collapse">${thead}<tbody>${tbody}</tbody></table></div>
      </div>`;
  });

  // ── Monthly Summary Section ──
  // Build list of all months that have data
  const allMonths = [...new Set(
    Object.values(USAGE).map(e=>{
      const d = new Date(e.ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    })
  )].sort().reverse();

  // Generate all months from earliest data to now for the selector
  const nowDate = new Date();
  const allSelectMonths = [];
  if(allMonths.length){
    const earliest = allMonths[allMonths.length-1];
    let [ey,em] = earliest.split("-").map(Number);
    const cy = nowDate.getFullYear(), cm = nowDate.getMonth()+1;
    while(ey < cy || (ey===cy && em<=cm)){
      allSelectMonths.push(`${ey}-${String(em).padStart(2,"0")}`);
      em++; if(em>12){ em=1; ey++; }
    }
    allSelectMonths.reverse();
  } else {
    // No data yet — just show current month
    allSelectMonths.push(`${nowDate.getFullYear()}-${String(nowDate.getMonth()+1).padStart(2,"0")}`);
  }

  if(!_trkMonth || !allSelectMonths.includes(_trkMonth)) _trkMonth = allSelectMonths[0];

  function mLabel(ym){ const[y,m]=ym.split("-"); return new Date(+y,+m-1,1).toLocaleString("default",{month:"long",year:"numeric"}); }

  const monthSelector = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div style="font-weight:700;font-size:15px">📅 Monthly Summary</div>
    <select onchange="setTrkMonth(this.value)" style="padding:8px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--bg);color:var(--text);cursor:pointer">
      ${allSelectMonths.map(m=>`<option value="${m}" ${m===_trkMonth?"selected":""}>${mLabel(m)}</option>`).join("")}
    </select>
  </div>`;

  // Filter usage entries for selected month
  const monthEntries = Object.entries(USAGE).filter(([,e])=>{
    const d=new Date(e.ts);
    const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    return ym===_trkMonth && (_trkShow==="both"||e.type===_trkShow);
  });

  // Get weeks in this month
  const monthWeekSet = new Set(monthEntries.map(([,e])=>e.week||isoWeek(e.ts)));
  const monthWeeks = [...monthWeekSet].sort();
  const weekCount = monthWeeks.length || 1;

  // Build monthly data[name][fac] = {total, byWeek:{week:qty}}
  const mData={};
  monthEntries.forEach(([id,e])=>{
    if(!mData[e.name]) mData[e.name]={};
    const fac=e.facility||getFacility(e.location||"");
    if(!mData[e.name][fac]) mData[e.name][fac]={total:0,byWeek:{}};
    const wk=e.week||isoWeek(e.ts);
    mData[e.name][fac].total+=(e.qty||0);
    mData[e.name][fac].byWeek[wk]=(mData[e.name][fac].byWeek[wk]||0)+(e.qty||0);
  });

  let mSection = monthSelector;

  if(!monthEntries.length){
    mSection+=`<div class="card"><div class="empty"><div class="empty-icon">📅</div>No distribution data for ${mLabel(_trkMonth)}.</div></div>`;
  } else {
    scopedHubs().forEach(fac=>{
      const facNames=Object.keys(mData).filter(n=>mData[n][fac]).sort();
      if(!facNames.length) return;

      let thead=`<tr>
        <th style="min-width:160px">Item</th>
        <th style="text-align:right;min-width:90px">Total</th>
        <th style="text-align:right;min-width:90px">Wkly Avg</th>
      </tr>`;

      let tbody="";
      let grandTotal=0;
      facNames.forEach(name=>{
        const fd=mData[name][fac];
        const total=fd.total||0;
        const wkAvg=(total/weekCount).toFixed(1);
        grandTotal+=total;
        tbody+=`<tr>
          <td style="font-weight:600;font-size:13px">${esc(name)}</td>
          <td style="text-align:right;font-weight:700;color:var(--scarlet)">${total}</td>
          <td style="text-align:right;color:var(--text2)">${wkAvg}</td>
        </tr>`;
      });
      tbody+=`<tr style="border-top:2px solid var(--border);background:var(--bg2)">
        <td style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text3)">Total</td>
        <td style="text-align:right;font-weight:700;color:var(--scarlet)">${grandTotal}</td>
        <td style="text-align:right;font-weight:700;color:var(--text2)">${(grandTotal/weekCount).toFixed(1)}</td>
      </tr>`;

      const icon="🏭";
      mSection+=`<div class="card" style="margin-bottom:16px">
        <div style="padding:12px 16px;background:var(--black);color:#fff;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--scarlet)">${icon} ${fac}</div>
        <div style="padding:8px 16px;font-size:12px;color:var(--text3);border-bottom:1px solid var(--border)">${weekCount} week${weekCount!==1?"s":""} of data · ${mLabel(_trkMonth)}</div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="width:100%;border-collapse:collapse">${thead}<tbody>${tbody}</tbody></table></div>
      </div>`;
    });
  }

  h += `<div style="margin-top:24px;border-top:2px solid var(--border);padding-top:20px">${mSection}</div>`;
  app.innerHTML=h;
}

function openCheckIn(){
  const who = localStorage.getItem("inv_display_name")||(currentUser?.displayName||currentUser?.email||"Unknown");
  showModal(`<div class="mhandle"></div><h2>📋 Log Inventory Check</h2>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">Record that you've checked and counted inventory at a location.</div>
    <div class="fg"><label>Location *</label>
      <select id="chk-loc">
        ${SLOCS.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join("")}
      </select>
    </div>
    <div class="fg"><label>Your Name</label>
      <input id="chk-who" value="${esc(who)}" placeholder="Your name">
    </div>
    <div class="fg"><label>Notes (optional)</label>
      <input id="chk-notes" placeholder="e.g. Restocked bananas, low on protein bars">
    </div>
    <div class="macts">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn p" onclick="doCheckIn()">Log Check-In</button>
    </div>`);
}

async function doCheckIn(){
  const loc   = fvs("chk-loc");
  const who   = fv("chk-who")||localStorage.getItem("inv_display_name")||(currentUser?.displayName||"Unknown");
  const notes = fv("chk-notes");
  if(!loc){ alert("Please select a location."); return; }
  silentClose();
  const now = Date.now();
  await set(push(ref(db,"checkins")),{
    location: loc,
    who,
    notes,
    ts:   now,
    date: new Date(now).toLocaleDateString(),
    time: new Date(now).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
  });
  await fLog(`[Check-In] ${who} checked inventory at ${loc}${notes?" — "+notes:""}`);
  render();
}

function renderCheckIn(app){
  const entries = Object.values(CHECKINS).sort((a,b)=>(b.ts||0)-(a.ts||0));

  // Group by location — show most recent check per location
  const byLoc = {};
  entries.forEach(e=>{ if(!byLoc[e.location]) byLoc[e.location]=e; });

  // Recent activity log
  const recent = entries.slice(0,50);

  let h=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <div style="font-size:13px;color:var(--text2)">Log when you've checked inventory at a location.</div>
    <button class="btn p" onclick="openCheckIn()" style="white-space:nowrap">📋 Log Check-In</button>
  </div>

  <!-- Last check per location -->
  <div class="card" style="margin-bottom:16px">
    <div style="padding:12px 16px;background:var(--black);color:#fff;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--scarlet)">
      Last Check by Location
    </div>`;

  if(!Object.keys(byLoc).length){
    h+=`<div class="empty" style="padding:30px"><div class="empty-icon">📋</div>No check-ins yet.</div>`;
  } else {
    SLOCS.forEach(loc=>{
      const last = byLoc[loc];
      h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-weight:700;font-size:13px">${esc(loc)}</div>
          ${last
            ?`<div style="font-size:12px;color:var(--text2);margin-top:2px">${esc(last.who)} · ${last.date} at ${last.time}${last.notes?` · ${esc(last.notes)}`:""}</div>`
            :`<div style="font-size:12px;color:var(--text3);margin-top:2px">Never checked</div>`}
        </div>
        ${last
          ?`<span style="font-size:11px;color:var(--text3);white-space:nowrap;margin-left:12px">${timeSince(last.ts)}</span>`
          :`<span style="font-size:11px;color:var(--red);white-space:nowrap;margin-left:12px">⚠️ None</span>`}
      </div>`;
    });
  }
  h+=`</div>

  <!-- Recent activity -->
  <div class="card">
    <div style="padding:12px 16px;background:var(--black);color:#fff;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--scarlet)">
      Recent Check-Ins
    </div>`;

  if(!recent.length){
    h+=`<div class="empty" style="padding:24px"><div class="empty-icon">📋</div>No check-ins logged yet.</div>`;
  } else {
    recent.forEach(e=>{
      h+=`<div class="alog"><div class="alog-dot"></div><div class="alog-body">
        <div class="alog-msg"><strong>${esc(e.who)}</strong> checked <strong>${esc(e.location)}</strong>${e.notes?` — ${esc(e.notes)}`:""}</div>
        <div class="alog-time">${e.date} at ${e.time} · ${timeSince(e.ts)}</div>
      </div></div>`;
    });
  }
  h+=`</div>`;
  app.innerHTML=h;
}

function timeSince(ts){
  const diff = Date.now()-ts;
  const mins = Math.floor(diff/60000);
  const hrs  = Math.floor(diff/3600000);
  const days2= Math.floor(diff/86400000);
  if(mins<1)   return "just now";
  if(mins<60)  return `${mins}m ago`;
  if(hrs<24)   return `${hrs}h ago`;
  if(days2<7)  return `${days2}d ago`;
  return `${Math.floor(days2/7)}w ago`;
}

// Convert an order's qty/unit/perUnit into the item's base tracking unit (oz or count)
function ordToBaseQty(unit, qty, perUnit){
  if(unit==="lbs")  return qty*16;      // lbs -> oz
  if(unit==="oz")   return qty;
  if(unit==="each") return qty;
  if(unit==="case"||unit==="box"||unit==="pack") return qty*(perUnit||1);
  return qty;
}

// Every order is a list of delivery lines (one per location). Older single-hub orders are treated as one line.
function ordLines(o){
  if(Array.isArray(o.deliveries) && o.deliveries.length){
    return o.deliveries.map((d,idx)=>({idx,hub:d.hub,qty:d.qty,received:!!d.received,receivedQty:d.receivedQty,receivedTs:d.receivedTs}));
  }
  return [{idx:0,hub:o.hub||HUBS[0],qty:o.qty,received:o.status==="received",receivedQty:o.receivedQty,receivedTs:o.receivedTs}];
}

async function doAddOrder(){

  })).filter(d=>d.hub && d.qty>0);

async function doReceiveOrder(id,di){
  const o = ORDERS[id]; if(!o) return;
  const lines = ordLines(o);
  const line = lines[di||0]; if(!line) return;
  const qty     = Math.max(0.01, parseFloat(document.getElementById("recv-qty")?.value)||0.01);
  const expDate = document.getElementById("recv-exp")?.value||"";
  silentClose();

  const hub = line.hub||HUBS[0];
  const matched = allItems().find(i=>i.name.toLowerCase().trim()===o.name.toLowerCase().trim());

  const existing = allItems().find(i=>
    i.name.toLowerCase().trim()===o.name.toLowerCase().trim() &&
    i.location===hub &&
    (i.expDate||"")===(expDate||"")
  );

  if(existing){
    const newQty = Math.round(((existing.qty||0) + qty)*100)/100;
    await update(ref(db,`items/${existing.id}`),{qty:newQty});
    if(DB[existing.id]) DB[existing.id].qty = newQty;
  } else {
    await fAdd({
      name:         o.name,
      category:     matched?.category || CATS[0],
      location:     hub,
      qty:          Math.round(qty*100)/100,
      locThresh:    matched?.locThresh || DEF_LOW,
      grpThresh:    matched?.grpThresh || DEF_LOW,
      expDate,
      sku:          matched?.sku || "",
      notes:        `Received from order`,
      vendor:       o.vendor || matched?.vendor || "",
      caseSize:     matched?.caseSize||0,
      packName:     matched?.packName||"",
      packsPerCase: matched?.packsPerCase||0,
      packSize:     matched?.packSize||0,
      packUnit:     matched?.packUnit||"lbs",
      innerQty:     matched?.innerQty||0,
      innerName:    matched?.innerName||"",
      servingWt:    matched?.servingWt||0,
      price:        matched?.price || 0,
      priceType:    matched?.priceType || "unit",
      trackingUnit: (o.unit==="lbs"||o.unit==="oz") ? "oz" : (matched?.trackingUnit || "oz")
    });
  }

  const now = Date.now();
  if(Array.isArray(o.deliveries) && o.deliveries.length){
    const dels = o.deliveries.map((d,i)=> i===(di||0) ? {...d,received:true,receivedQty:qty,receivedTs:now} : d);
    const allDone = dels.every(d=>d.received);
    const upd = {deliveries:dels};
    if(allDone){ upd.status="received"; upd.receivedTs=now; }
    await update(ref(db,`orders/${id}`),upd);
    ORDERS[id] = {...o,...upd};
  } else {
    await update(ref(db,`orders/${id}`),{status:"received",receivedQty:qty,receivedTs:now});
    ORDERS[id] = {...o,status:"received",receivedQty:qty,receivedTs:now};
  }
  await fLog(`Order received: ${qty} of "${o.name}" → ${hub}`);
  render();
}

async function deleteOrder(id){
  const o = ORDERS[id]; if(!o) return;
  const n = ordLines(o).length;
  if(!confirm(`Delete order for "${o.name}"${n>1?` (all ${n} locations)`:""}?\n\nThis cannot be undone.`)) return;
  await remove(ref(db,`orders/${id}`));
  delete ORDERS[id];
  render();
}

/* ════════════════════════════════════════════
   TRUCK REFILL (top up to par from the hub)
════════════════════════════════════════════ */
function isTruckLoc(loc){ return TRUCKS.some(t=>t.name===loc); }

// Work out what a refill would look like for one truck item (by name at that truck)
function refillPlan(truckItem){
  const truck = TRUCKS.find(t=>t.name===truckItem.location);
  if(!truck) return null;
  const nameKey = truckItem.name.toLowerCase().trim();
  const onTruck = allItems().filter(i=>i.location===truck.name && i.name.toLowerCase().trim()===nameKey);
  const hubRecs = allItems().filter(i=>i.location===truck.hub && i.name.toLowerCase().trim()===nameKey && (i.qty||0)>0);
  const have   = onTruck.reduce((s,i)=>s+(i.qty||0),0);
  const par    = Math.max(...onTruck.map(i=>i.par||0), 0);
  const hubQty = hubRecs.reduce((s,i)=>s+(i.qty||0),0);
  const need   = Math.max(0, Math.round((par-have)*100)/100);
  return { truck, hub:truck.hub, target:onTruck[0]||truckItem, hubRecs, have, par, hubQty, need, send:Math.min(need,hubQty) };
}

// Move `amt` from the truck's hub to the truck item. Returns the amount actually moved.
async function refillCore(plan, amt){
  amt = Math.round(Math.min(amt, plan.hubQty)*100)/100;
  if(amt<=0) return 0;
  let left = amt;
  for(const r of plan.hubRecs){
    if(left<=0) break;
    const live = DB[r.id]?.qty||0;
    const take = Math.min(live,left);
    if(take<=0) continue;
    const nq = Math.round((live-take)*100)/100;
    DB[r.id].qty = nq;
    await update(ref(db,`items/${r.id}`),{qty:nq});
    left = Math.round((left-take)*100)/100;
  }
  const moved = Math.round((amt-left)*100)/100;
  const tq = Math.round(((DB[plan.target.id]?.qty||0)+moved)*100)/100;
  DB[plan.target.id].qty = tq;
  await update(ref(db,`items/${plan.target.id}`),{qty:tq});
  return moved;
}

function openRefill(ii){
  const id=(window._ids||[])[ii]; if(!id||!DB[id]) return;
  const item={...DB[id],id};
  const p=refillPlan(item); if(!p) return;
  const u=uLbl(item);
  if(!(p.par>0)){
    alert(`No par level is set for "${item.name}" on ${p.truck.name}.\n\nAsk a hub manager to set the Par Level in Edit.`);
    return;
  }
  if(p.need<=0){ alert(`${item.name} is already at par on ${p.truck.name} (${p.have} / ${p.par} ${u}).`); return; }
  window._refillId=id;

async function doRefill(){
  const id=window._refillId; if(!id||!DB[id]) return;
  const item={...DB[id],id};
  const p=refillPlan(item); if(!p) return;
  const amt=parseFloat(document.getElementById("refill-qty")?.value)||0;
  if(amt<=0){ alert("Enter an amount to refill."); return; }
  if(amt>p.hubQty){ alert(`${p.hub} only has ${p.hubQty} ${uLbl(item)}.`); return; }
  silentClose();
  modalOpen=true;
  const moved=await refillCore(p,amt);
  modalOpen=false;
  await fLog(`Refilled ${p.truck.name}: ${moved} ${uLbl(item)} of "${item.name}" from ${p.hub} (now ${Math.round((p.have+moved)*100)/100}/${p.par})`);
  render();
}

function refillAllPlans(){
  const truckName=viewLocs()[UI.tab-1];
  const seen=new Set(), plans=[];
  allItems().filter(i=>i.location===truckName && (i.par||0)>0).forEach(i=>{
    const k=i.name.toLowerCase().trim(); if(seen.has(k)) return; seen.add(k);
    const p=refillPlan(i); if(p && p.need>0) plans.push(p);
  });
  return {truckName, plans};
}

function openRefillAll(){
  const {truckName,plans}=refillAllPlans();
  if(!plans.length){ alert(`${truckName} is already at par for every item that has a par level.`); return; }
  const rows=plans.map(p=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">
      <span style="font-weight:600">${esc(p.target.name)}</span>
      <span>${p.send} ${uLbl(p.target)}${p.send<p.need?` <span style="color:var(--red)">(short ${Math.round((p.need-p.send)*100)/100})</span>`:""}</span>
    </div>`).join("");
  showModal(`<div class="mhandle"></div><h2>🔄 Refill ${esc(truckName)}</h2>
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">Tops every item up to its par level from ${esc(plans[0].hub)}:</div>
    ${rows}
    <div class="macts" style="margin-top:14px">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn p" onclick="doRefillAll()">✓ Refilled All</button>
    </div>`);
}

async function doRefillAll(){
  const {truckName,plans}=refillAllPlans();
  silentClose();
  modalOpen=true;
  let n=0;
  for(const p of plans){
    const fresh=refillPlan(DB[p.target.id]?{...DB[p.target.id],id:p.target.id}:p.target);
    if(fresh && fresh.send>0){ await refillCore(fresh,fresh.send); n++; }
  }
  modalOpen=false;
  await fLog(`Refilled ${truckName}: ${n} item${n!==1?"s":""} topped up to par`);
  render();
}


/* ════════════════════════════════════════════
   TRUCK SALES ORDERS → AUTOMATIC USAGE
   Orders land in /truckOrders (placed → completed). When an order is completed
   the ingredient amounts from its menu recipes are deducted from that truck and
   logged to the tracker automatically — no input from the crew.
════════════════════════════════════════════ */
const rnd2 = n => Math.round(n*100)/100;
function recipeByProduct(name){
  const k=(name||"").toLowerCase().trim();
  return Object.values(RECIPES).find(r=>(r.name||"").toLowerCase().trim()===k);
}
// Total ingredient amounts an order will use
function orderNeeds(o){
  const needs={}, unmapped=[];
  (o.items||[]).forEach(li=>{
    const r=recipeByProduct(li.product);
    if(!r){ unmapped.push(li.product); return; }
    (r.ingredients||[]).forEach(ing=>{
      const k=(ing.item||"").toLowerCase().trim();
      if(!k) return;
      needs[k]=needs[k]||{name:ing.item,qty:0};
      needs[k].qty += (Number(ing.qty)||0)*(Number(li.qty)||1);
    });
  });
  return {needs,unmapped};
}
// Open (placed) orders: ingredient amounts committed per hub
function pendingByFac(){
  const m={};
  Object.values(TORDERS).filter(o=>o.status==="placed" && scopedLocs().includes(o.truck)).forEach(o=>{
    const fac=getFacility(o.truck);
    Object.entries(orderNeeds(o).needs).forEach(([k,n])=>{
      m[fac]=m[fac]||{};
      m[fac][k]={name:n.name, qty:rnd2((m[fac][k]?.qty||0)+n.qty)};
    });
  });
  return m;
}

async function processCompletedOrders(){
  if(_procBusy||!db||!DB_LOADED||!RECIPES_LOADED) return;
  const todo=Object.entries(TORDERS).filter(([,o])=>o.status==="completed" && !o.applied);
  if(!todo.length) return;
  _procBusy=true;
  try{
    for(const [id,o] of todo){
      // Claim the order atomically so two open devices never deduct twice
      const res=await runTransaction(ref(db,`truckOrders/${id}/applied`), cur=> cur ? undefined : true);
      if(!res.committed) continue;
      try{ await applyOrderUsage(id,o); }
      catch(e){ console.error(e); await set(ref(db,`truckOrders/${id}/applied`),false); }
    }
  }catch(e){ console.error(e); }
  _procBusy=false;
}

async function applyOrderUsage(id,o){
  const {needs,unmapped}=orderNeeds(o);
  const truck=o.truck, now=Date.now(), short={};
  for(const n of Object.values(needs)){
    const nameKey=n.name.toLowerCase().trim();
    const recs=allItems().filter(i=>i.location===truck && i.name.toLowerCase().trim()===nameKey);
    let left=rnd2(n.qty);
    for(const r of recs){
      if(left<=0) break;
      const live=DB[r.id]?.qty||0, take=Math.min(live,left);
      if(take<=0) continue;
      const nq=rnd2(live-take);
      DB[r.id].qty=nq;
      await update(ref(db,`items/${r.id}`),{qty:nq});
      left=rnd2(left-take);
    }
    if(left>0.001) short[n.name]=left;
    const price=recs[0]?.price||0;
    await set(push(ref(db,"usage")),{
      name:n.name, qty:rnd2(n.qty), type:"used", facility:getFacility(truck), location:truck,
      week:isoWeek(now), ts:now, who:"Order "+(o.ref||id), date:new Date(now).toLocaleDateString(),
      price, priceType:recs[0]?.priceType||"unit", value:rnd2(price*n.qty), source:"order", orderId:id
    });
  }
  await update(ref(db,`truckOrders/${id}`),{unmapped, short, appliedTs:now});
  await fLog(`Order ${o.ref||id} completed on ${truck}: ${Object.keys(needs).length} ingredient${Object.keys(needs).length!==1?"s":""} deducted${Object.keys(short).length?" (short: "+Object.entries(short).map(([k,v])=>k+" "+v).join(", ")+")":""}${unmapped.length?" — no recipe for: "+unmapped.join(", "):""}`);
}

async function setTruckOrderStatus(id,status){
  if(!canEdit()) return;

  if(status==="cancelled" && !confirm(`Cancel order ${o.ref||""}?`)) return;
  const upd={status}; if(status==="completed") upd.completedTs=Date.now();
  await update(ref(db,`truckOrders/${id}`),upd);
}

function fillStarterItems(){ const t=document.getElementById("imp-text"); if(t) t.value=STARTER_ITEMS; }
async function doImportItems(){
  const text=document.getElementById("imp-text")?.value||"";
  const sel=document.getElementById("imp-hub")?.value||"__all";
  const rows=text.split(/\r?\n/).map(l=>l.split("\t").map(x=>x.trim())).filter(r=>r[0]);
  if(!rows.length){ alert("Paste at least one row."); return; }
  const hubs = sel==="__all" ? scopedHubs() : [sel];
  silentClose();
  const have=new Set(allItems().map(i=>i.name.toLowerCase().trim()+"||"+i.location));
  const updates={}; let n=0;
  rows.forEach((r,idx)=>{
    const [name,vendor="",catRaw=""]=r;
    const category=catRaw||"Uncategorized";
    hubs.forEach(h=>{
      const key=name.toLowerCase().trim()+"||"+h;
      if(have.has(key)) return;
      have.add(key);
      const id=push(ref(db,"items")).key;
      const rec={...clean({name,vendor,category,location:h,qty:0,trackingUnit:importUnitFor(category)}),sortOrder:idx};
      updates["items/"+id]=rec; n++;
      DB[id]=rec;
    });
  });
  if(!n){ alert("Nothing to import — those items already exist."); render(); return; }
  await update(ref(db,"/"),updates);
  await fLog(`Imported ${n} item record${n!==1?"s":""} (${rows.length} item${rows.length!==1?"s":""})`);
  render();
}

    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">${Object.entries(cats).map(([k,v])=>`${esc(k)}: ${v}`).join(" · ")}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px;line-height:1.5">Each item gets its case setup (for ordering), unit cost, serving weight, and counts in the same unit as the sheet (ounces, sleeves, bottles, jugs and so on).</div>
    ${flagged.length?`<div style="background:var(--bg2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;max-height:180px;overflow:auto">
      <div style="font-size:12px;font-weight:700;margin-bottom:6px">Check these (incomplete or unclear in the sheet):</div>
      ${flagged.map(r=>`<div style="font-size:12px;margin-bottom:4px"><strong>${esc(r.n)}</strong> — ${esc(r.fl)}</div>`).join("")}
    </div>`:""}
    <div class="macts">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn p" onclick="doHubSeed()">Load Items</button>
    </div>`);
}
async function doHubSeed(){
  const hubs=scopedHubs();
  silentClose();
  const updates={}; let created=0, updated=0;
  const existing={}; allItems().forEach(i=>{ existing[i.name.toLowerCase().trim()+"||"+i.location]=i; });
  HUB_SEED.forEach((r,idx)=>{
    const f={ vendor:r.v, category:r.c||"Uncategorized", trackingUnit:validUnit(r.u), caseSize:r.cs, packName:r.pn,
              packsPerCase:r.ppc, packSize:r.ps, packUnit:r.pu, price:r.pr, priceType:"unit", servingWt:r.sw, innerQty:r.iq||0, innerName:r.in||"" };
    hubs.forEach(h=>{
      const cur=existing[r.n.toLowerCase().trim()+"||"+h];
      if(cur){
        Object.entries({...f,sortOrder:idx}).forEach(([k,v])=>{ updates[`items/${cur.id}/${k}`]=v; });
        if(!cur.notes && r.no) updates[`items/${cur.id}/notes`]=r.no;
        if(DB[cur.id]) Object.assign(DB[cur.id],f,{sortOrder:idx});
        updated++;
      } else {
        const id=push(ref(db,"items")).key;
        const rec={...clean({name:r.n,location:h,qty:0,notes:r.no,...f}),sortOrder:idx};
        updates["items/"+id]=rec; DB[id]=rec; created++;
      }
    });
  });
  await update(ref(db,"/"),updates);
  await fLog(`Loaded inventory list: ${created} item records created, ${updated} updated across ${hubs.length} hub${hubs.length!==1?"s":""}`);
  render();
}

/* ════════════════════════════════════════════
   STOCK TRUCKS — set up everything that rides on a truck (amounts start at 0, optional par levels)
════════════════════════════════════════════ */
function openStockTrucks(tabIdx){
  const trucks=TRUCKS.filter(t=>scopedLocs().includes(t.name));
  if(!trucks.length){ alert("Add a truck first (Settings → Trucks)."); return; }
  const hubSet=new Set(HUBS), byName={};
  allItems().filter(i=>hubSet.has(i.location)).forEach(i=>{ const k=i.name.toLowerCase().trim(); if(!byName[k]) byName[k]=i; });
  const items=Object.values(byName).sort((a,b)=>(a.sortOrder-b.sortOrder)||a.name.localeCompare(b.name));
  if(!items.length){ alert("Load the hub inventory first (Settings → Load Scream Truck Inventory)."); return; }
  window._stockItems=items;
  const pre = tabIdx>0 ? viewLocs()[tabIdx-1] : null;
  const tpl = Array.isArray(TRUCK_TPL.items) ? TRUCK_TPL.items : null;
  const tplMap = {}; (tpl||[]).forEach(t=>{ tplMap[t.n.toLowerCase().trim()]=t.p; });
  const parOf = i => { const k=i.name.toLowerCase().trim(); if(k in tplMap && tplMap[k]) return tplMap[k];
    const ex=allItems().find(x=>x.name.toLowerCase().trim()===k && isTruckLoc(x.location) && x.par>0); return ex?ex.par:""; };
  const isOn = i => tpl ? (i.name.toLowerCase().trim() in tplMap) : !["Cleaning","Uncategorized"].includes(i.category);
  const cats=[]; items.forEach(i=>{ const c=i.category||"Uncategorized"; if(!cats.includes(c)) cats.push(c); });
  let list="";
  cats.forEach((cat,ci)=>{
    const its=items.map((i,idx)=>({i,idx})).filter(x=>(x.i.category||"Uncategorized")===cat);
    list+=`<label style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px solid var(--border);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-top:6px">
      <input type="checkbox" onchange="stockToggleCat(${ci},this.checked)" ${its.every(x=>isOn(x.i))?"checked":""}> ${esc(cat)} <span style="font-weight:400;color:var(--text3)">(${its.length})</span></label>`;
    its.forEach(({i,idx})=>{
      list+=`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)">
        <input type="checkbox" class="stk-chk" data-cat="${ci}" data-i="${idx}" ${isOn(i)?"checked":""}>
        <span style="flex:1;min-width:0;font-size:13px">${esc(i.name)} <span style="font-size:11px;color:var(--text3)">${esc(unitShort(i.trackingUnit))}</span></span>
        <input class="stk-par" data-i="${idx}" type="number" min="0" step="0.01" value="${parOf(i)}" placeholder="par" style="width:78px;padding:6px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg2);font-size:12px">
      </div>`;
    });
  });
  showModal(`<div class="mhandle"></div><h2>📥 Stock Trucks</h2>
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.5">Pick the trucks and the items that go on them. Each item is added with an amount of 0. The <strong>par</strong> box is the amount that should be on the truck at the start of the day (used by 🔄 Refill) and can be left blank for now.</div>
    <div class="fg"><label>Trucks</label><div style="display:flex;flex-wrap:wrap;gap:12px">
      ${trucks.map(t=>`<label style="display:flex;align-items:center;gap:5px;font-size:13px"><input type="checkbox" class="stk-truck" value="${esc(t.name)}" ${(!pre||pre===t.name)?"checked":""}> ${esc(t.name)} <span style="font-size:11px;color:var(--text3)">${esc(t.hub)}</span></label>`).join("")}
    </div></div>
    <div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:var(--r);padding:0 10px;margin-bottom:12px">${list}</div>
    <div class="macts">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn p" onclick="doStockTrucks()">Add to Trucks</button>
    </div>`);
}
function stockToggleCat(ci,on){ document.querySelectorAll(`.stk-chk[data-cat="${ci}"]`).forEach(el=>{ el.checked=on; }); }
async function doStockTrucks(){
  const trucks=[...document.querySelectorAll(".stk-truck:checked")].map(e=>e.value);
  const picks=[...document.querySelectorAll(".stk-chk:checked")].map(e=>{
    const idx=+e.dataset.i;
    return {item:window._stockItems[idx], par:Math.max(0,parseFloat(document.querySelector(`.stk-par[data-i="${idx}"]`)?.value)||0)};
  });
  if(!trucks.length||!picks.length){ alert("Pick at least one truck and one item."); return; }
  silentClose();
  const existing={}; allItems().forEach(i=>{ existing[i.name.toLowerCase().trim()+"||"+i.location]=i; });
  const updates={}; let created=0, updated=0;
  trucks.forEach(tn=>{
    const truck=TRUCKS.find(t=>t.name===tn); if(!truck) return;
    picks.forEach(({item,par})=>{
      const k=item.name.toLowerCase().trim();
      // use this truck's own hub record as the template when there is one
      const tpl=allItems().find(x=>x.name.toLowerCase().trim()===k && x.location===truck.hub) || item;
      const f={vendor:tpl.vendor||"",category:tpl.category,trackingUnit:tpl.trackingUnit,caseSize:tpl.caseSize,packName:tpl.packName,
               packsPerCase:tpl.packsPerCase,packSize:tpl.packSize,packUnit:tpl.packUnit,price:tpl.price,priceType:tpl.priceType,
               servingWt:tpl.servingWt,innerQty:tpl.innerQty,innerName:tpl.innerName,sortOrder:tpl.sortOrder,par};
      const cur=existing[k+"||"+tn];
      if(cur){
        Object.entries(f).forEach(([key,v])=>{ updates[`items/${cur.id}/${key}`]=v; });
        if(DB[cur.id]) Object.assign(DB[cur.id],f);
        updated++;
      } else {
        const id=push(ref(db,"items")).key;
        const rec={...clean({name:tpl.name,location:tn,qty:0,notes:"",...f}),sortOrder:tpl.sortOrder};
        updates["items/"+id]=rec; DB[id]=rec; created++;
      }
    });
  });
  updates["config/truckTemplate"]={items:picks.map(p=>({n:p.item.name,p:p.par}))};
  await update(ref(db,"/"),updates);
  await fLog(`Stocked trucks (${trucks.join(", ")}): ${created} item records added, ${updated} updated`);
  render();
}
